# One pod = one desktop session. Scale with replicas, never with sessions
# inside a pod: the Wine prefix and the WebView2 profile are single-writer.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: winforms-wine-prefix
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 4Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: winforms-app-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: winforms-app
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: winforms-app
  template:
    metadata:
      labels:
        app: winforms-app
    spec:
      securityContext:
        # Wine writes across the prefix; runAsNonRoot is not compatible.
        runAsUser: 0
      containers:
        - name: app
          # Published runtime image: it holds Wine, KasmVNC and WebView2 but no
          # application. Build your own image `FROM` the same CalVer tag plus
          # `COPY publish/ /app`.
          # As written the pod cannot start: the runtime contains no /app.
          image: ghcr.io/webees/winforms-wine-runtime:2026.11.22.2
          env:
            - name: ENABLE_VNC
              value: "1"
            # TLS is terminated by the Ingress; keep the pod on plain HTTP.
            - name: KASMVNC_SSL
              value: "0"
            # kubectl create secret generic winforms-app \
            #   --from-literal=vnc-password='...'
            - name: VNC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: winforms-app
                  key: vnc-password
          ports:
            - name: desktop
              containerPort: 6901
          volumeMounts:
            - name: prefix
              mountPath: /wine
            - name: data
              mountPath: /data
            - name: shm
              mountPath: /dev/shm
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
          readinessProbe:
            tcpSocket:
              port: desktop
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: desktop
            initialDelaySeconds: 90
            periodSeconds: 30
      volumes:
        - name: prefix
          persistentVolumeClaim:
            claimName: winforms-wine-prefix
        - name: data
          persistentVolumeClaim:
            claimName: winforms-app-data
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: winforms-app
spec:
  selector:
    app: winforms-app
  ports:
    - name: desktop
      port: 6901
      targetPort: desktop
