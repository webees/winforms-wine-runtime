name: Feature request
description: Propose a capability or a compatibility fix
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Scope check: this project ships a runtime image. Application code,
        Windows shell features and multi-session hosting are out of scope.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can you not do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should the image or scripts do instead?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This keeps the image amd64-only
          required: true
        - label: This does not require a Windows licence
          required: true
