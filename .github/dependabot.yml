version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # WebView2 is pinned deliberately; see docs/architecture.md.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      docker:
        patterns: ['*']

  - package-ecosystem: nuget
    directory: /src/self-test
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
