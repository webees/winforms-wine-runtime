name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing CalVer tag, e.g. v2026.11.17
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  verify:
    name: verify tag
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      revision: ${{ steps.meta.outputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - id: meta
        name: resolve version
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          version="$(./scripts/version.sh check "$tag")"
          release_date="$(printf '%s' "$version" | cut -d. -f1-3 | tr . -)"
          heading="## [$version] - $release_date"
          grep -Fq "$heading" CHANGELOG.md || {
            echo "::error::CHANGELOG.md needs '$heading'"; exit 1; }
          git merge-base --is-ancestor "$tag" origin/main || {
            echo "::error::$tag is not on main"; exit 1; }
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "revision=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

  publish:
    name: publish image
    runs-on: ubuntu-24.04
    needs: [verify, test]
    permissions:
      contents: write
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify.outputs.tag }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.verify.outputs.version }}
            type=raw,value=2
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=winforms-wine-runtime
            org.opencontainers.image.description=Run .NET 8 WinForms + WebView2 + SunnyUI + Magick.NET in Linux containers
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ needs.verify.outputs.version }}

      - id: build
        name: build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: base
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=runtime
          build-args: |
            IMAGE_VERSION=${{ needs.verify.outputs.version }}
            SOURCE_REVISION=${{ needs.verify.outputs.revision }}

      - name: release notes
        run: |
          set -euo pipefail
          version="${{ needs.verify.outputs.version }}"
          awk -v v="$version" '
            $0 ~ "^## \\["v"\\]" {flag=1; next}
            flag && /^## \[/ {exit}
            flag {print}
          ' CHANGELOG.md > notes.md
          test -s notes.md || echo "Release $version" > notes.md
          echo "See [CHANGELOG.md](CHANGELOG.md) for details." >> notes.md

      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          tag_name: ${{ needs.verify.outputs.tag }}
          name: ${{ needs.verify.outputs.tag }}
          body_path: notes.md
          draft: false
          generate_release_notes: false

  test:
    name: bench release
    runs-on: ubuntu-24.04
    needs: verify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify.outputs.tag }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: build demo target at the released tag
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: demo
          platforms: linux/amd64
          load: true
          tags: winforms-wine-runtime:release-check
          cache-from: type=gha,scope=runtime
          build-args: |
            IMAGE_VERSION=${{ needs.verify.outputs.version }}
            SOURCE_REVISION=${{ needs.verify.outputs.revision }}

      - name: benchmark and score
        run: |
          set -euo pipefail
          IMAGE=winforms-wine-runtime:release-check \
            ./scripts/bench.sh --out bench.json --evidence evidence
          ./scripts/score.py bench.json --min 90 | tee bench.txt

      - name: upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-bench
          path: |
            bench.json
            bench.txt
            evidence/report.json
            evidence/*.png
          if-no-files-found: warn
          retention-days: 30

  attest:
    name: attest
    runs-on: ubuntu-24.04
    needs: [verify, publish]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: attest image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ needs.publish.outputs.digest }}
          push-to-registry: true
