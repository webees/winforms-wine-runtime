name: Cleanup workflow runs

# Deletes old workflow runs, caches and artifacts. Runs are kept per workflow so
# that recent history of every workflow stays visible.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      keep_runs:
        description: Runs to keep per workflow
        default: '20'
        required: false
      max_age_days:
        description: Also delete runs older than this many days
        default: '30'
        required: false

permissions:
  actions: write
  contents: read

concurrency:
  group: cleanup-runs
  cancel-in-progress: false

jobs:
  prune:
    name: prune
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/github-script@v7
        env:
          KEEP_RUNS: ${{ inputs.keep_runs || '20' }}
          MAX_AGE_DAYS: ${{ inputs.max_age_days || '30' }}
        with:
          script: |
            const keep = Number(process.env.KEEP_RUNS);
            const maxAgeDays = Number(process.env.MAX_AGE_DAYS);
            const cutoff = Date.now() - maxAgeDays * 86400_000;
            const { owner, repo } = context.repo;

            const workflows = await github.paginate(
              github.rest.actions.listRepoWorkflows,
              { owner, repo, per_page: 100 });

            let deleted = 0;
            for (const wf of workflows) {
              const runs = await github.paginate(
                github.rest.actions.listWorkflowRuns,
                { owner, repo, workflow_id: wf.id, per_page: 100 });

              for (const [index, run] of runs.entries()) {
                const tooOld = new Date(run.created_at).getTime() < cutoff;
                if (index < keep && !tooOld) continue;
                if (run.status !== 'completed') continue;
                try {
                  await github.rest.actions.deleteWorkflowRun({
                    owner, repo, run_id: run.id });
                  deleted++;
                } catch (error) {
                  core.warning(`run ${run.id}: ${error.message}`);
                }
              }
            }

            core.info(`deleted ${deleted} workflow run(s)`);
            core.setOutput('deleted', deleted);

      - name: prune caches
        uses: actions/github-script@v7
        env:
          MAX_AGE_DAYS: ${{ inputs.max_age_days || '30' }}
        with:
          script: |
            const cutoff = Date.now()
              - Number(process.env.MAX_AGE_DAYS) * 86400_000;
            const { owner, repo } = context.repo;
            const caches = await github.paginate(
              github.rest.actions.getActionsCacheList,
              { owner, repo, per_page: 100 });

            let deleted = 0;
            for (const cache of caches) {
              if (new Date(cache.last_accessed_at).getTime() >= cutoff) continue;
              try {
                await github.rest.actions.deleteActionsCacheById({
                  owner, repo, cache_id: cache.id });
                deleted++;
              } catch (error) {
                core.warning(`cache ${cache.id}: ${error.message}`);
              }
            }
            core.info(`deleted ${deleted} cache(s)`);

      - name: prune artifacts
        uses: actions/github-script@v7
        env:
          MAX_AGE_DAYS: ${{ inputs.max_age_days || '30' }}
        with:
          script: |
            const cutoff = Date.now()
              - Number(process.env.MAX_AGE_DAYS) * 86400_000;
            const { owner, repo } = context.repo;
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner, repo, per_page: 100 });

            let deleted = 0;
            for (const artifact of artifacts) {
              if (new Date(artifact.created_at).getTime() >= cutoff) continue;
              try {
                await github.rest.actions.deleteArtifact({
                  owner, repo, artifact_id: artifact.id });
                deleted++;
              } catch (error) {
                core.warning(`artifact ${artifact.id}: ${error.message}`);
              }
            }
            core.info(`deleted ${deleted} artifact(s)`);
