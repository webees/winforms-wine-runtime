name: Cleanup actions

# Deletes old workflow runs, caches and artifacts. Runs are kept per workflow so
# that recent history of every workflow stays visible.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      keep_runs:
        description: Runs to keep per workflow
        default: '20'
        required: false
      max_age_days:
        description: Also delete runs older than this many days
        default: '30'
        required: false

permissions:
  actions: write
  contents: read

concurrency:
  group: cleanup-runs
  cancel-in-progress: false

jobs:
  prune:
    name: prune
    runs-on: ubuntu-24.04
    steps:
      - name: prune runs, caches and artifacts
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          KEEP_RUNS: ${{ inputs.keep_runs || '20' }}
          MAX_AGE_DAYS: ${{ inputs.max_age_days || '30' }}
        with:
          script: |
            const keep = Number(process.env.KEEP_RUNS);
            const maxAgeDays = Number(process.env.MAX_AGE_DAYS);
            if (!Number.isInteger(keep) || keep < 1) {
              core.setFailed(`keep_runs must be a positive integer, got '${process.env.KEEP_RUNS}'`);
              return;
            }
            if (!Number.isFinite(maxAgeDays) || maxAgeDays < 1) {
              core.setFailed(`max_age_days must be a positive number, got '${process.env.MAX_AGE_DAYS}'`);
              return;
            }
            const cutoff = Date.now() - maxAgeDays * 86400_000;
            const { owner, repo } = context.repo;

            const warn = (what, id, error) =>
              core.warning(`${what} ${id}: ${error.message}`);

            // Workflow runs: keep the newest `keep` runs per workflow unless
            // they are older than the age cutoff.
            const workflows = await github.paginate(
              github.rest.actions.listRepoWorkflows,
              { owner, repo, per_page: 100 });

            let runs = 0;
            for (const wf of workflows) {
              const list = await github.paginate(
                github.rest.actions.listWorkflowRuns,
                { owner, repo, workflow_id: wf.id, per_page: 100 });

              for (const [index, run] of list.entries()) {
                const tooOld = new Date(run.created_at).getTime() < cutoff;
                if (index < keep && !tooOld) continue;
                if (run.status !== 'completed') continue;
                try {
                  await github.rest.actions.deleteWorkflowRun({
                    owner, repo, run_id: run.id });
                  runs++;
                } catch (error) {
                  warn('run', run.id, error);
                }
              }
            }

            // Caches and artifacts are pruned purely by age.
            const caches = await github.paginate(
              github.rest.actions.getActionsCacheList,
              { owner, repo, per_page: 100 });

            let cacheCount = 0;
            for (const cache of caches) {
              if (new Date(cache.last_accessed_at).getTime() >= cutoff) continue;
              try {
                await github.rest.actions.deleteActionsCacheById({
                  owner, repo, cache_id: cache.id });
                cacheCount++;
              } catch (error) {
                warn('cache', cache.id, error);
              }
            }

            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner, repo, per_page: 100 });

            let artifactCount = 0;
            for (const artifact of artifacts) {
              if (new Date(artifact.created_at).getTime() >= cutoff) continue;
              try {
                await github.rest.actions.deleteArtifact({
                  owner, repo, artifact_id: artifact.id });
                artifactCount++;
              } catch (error) {
                warn('artifact', artifact.id, error);
              }
            }

            core.info(
              `deleted ${runs} run(s), ${cacheCount} cache(s), ${artifactCount} artifact(s)`);
            core.setOutput('deleted_runs', runs);
