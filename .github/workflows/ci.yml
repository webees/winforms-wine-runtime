name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: winforms-wine-runtime

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: score tests
        run: python3 scripts/test_score.py

      - name: quality tests
        run: python3 scripts/test_quality.py

      - name: shellcheck
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck --version
          shellcheck -x docker/*.sh scripts/*.sh

      - name: shfmt
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/w" -w /w mvdan/shfmt:v3.12.0 -d docker scripts

      - name: ruff
        run: |
          set -euo pipefail
          python3 -m pip install --user -q ruff==0.17.5
          "$HOME/.local/bin/ruff" check scripts

      - name: hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml
          failure-threshold: warning

      - name: actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          fail-on-error: true

      - name: repository quality
        run: python3 scripts/quality.py --json quality.json

      - name: upload quality report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: quality-report
          path: quality.json
          retention-days: 14

      - name: docs match code
        run: ./scripts/check-docs.sh

      - name: example compose file
        run: VNC_PASSWORD=example docker compose -f examples/docker-compose.yml config >/dev/null

      - name: action pins
        run: ./scripts/check-action-pins.sh

  build:
    name: build + bench
    runs-on: ubuntu-24.04
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: build runtime target
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: base
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}:ci
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,scope=runtime,mode=max
          build-args: |
            IMAGE_VERSION=ci
            SOURCE_REVISION=${{ github.sha }}

      - name: build self-test target
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: demo
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}:ci-demo
          cache-from: type=gha,scope=runtime
          build-args: |
            IMAGE_VERSION=ci
            SOURCE_REVISION=${{ github.sha }}

      - name: image size budget
        run: |
          set -euo pipefail
          # Same yardstick as scripts/bench.sh and docs/benchmark.md.
          base=$(docker run --rm --entrypoint du "$IMAGE:ci" -sbx / | awk '{print $1}')
          printf 'base=%.2f GiB\n' "$(echo "$base" | awk '{print $1/1073741824}')"
          # Guard against accidental inclusion of i386 Wine or a duplicated runtime.
          test "$base" -lt 4831838208 || { echo "::error::base image exceeds 4.5 GiB"; exit 1; }

      - name: runtime ships no application
        run: |
          set -euo pipefail
          leftover=$(docker run --rm --entrypoint find "$IMAGE:ci" /app -mindepth 1 -print -quit)
          test -z "$leftover" || { echo "::error::runtime image contains $leftover"; exit 1; }

      - name: container hardening check
        run: |
          set -euo pipefail
          # The image must not start without an application.
          if docker run --rm "$IMAGE:ci" >/tmp/noapp.log 2>&1; then
            echo "::error::image started with no application"
            exit 1
          fi
          grep -q 'no .exe in /app' /tmp/noapp.log || {
            echo "::error::missing guard for empty /app"; cat /tmp/noapp.log; exit 1; }

      - name: benchmark and score
        run: |
          set -euo pipefail
          IMAGE="$IMAGE:ci-demo" ./scripts/bench.sh --out bench.json --evidence evidence
          ./scripts/score.py bench.json --min 90 | tee bench.txt

      - name: upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bench-evidence
          path: |
            bench.json
            bench.txt
            evidence/report.json
            evidence/*.png
          if-no-files-found: warn
          retention-days: 7

  scan:
    name: scan
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: build for scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: base
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}:scan
          cache-from: type=gha,scope=runtime

      - name: trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:scan
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: upload sarif
        if: always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: trivy.sarif

      - name: fail on critical
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:scan
          format: table
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true
